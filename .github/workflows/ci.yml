name: CI

# Runs on every push to main and every pull request, and is called by the
# release workflow so a tag can never publish an unverified build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bunx @biomejs/biome ci .

      - name: Types
        run: bun run check-types

      - name: Tests
        run: bun run test

  rust:
    name: Rust format, lints and bindings
    # Windows because the desktop app only ships there; avoids installing the
    # Linux webkit2gtk stack just to lint.
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/web/src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # `cargo test` regenerates the ts-rs bindings consumed by the frontend.
      - name: Tests and binding generation
        run: cargo test

      - name: Fail if the generated bindings are stale
        shell: bash
        run: |
          if ! git diff --exit-code -- ../src/lib/valorant/bindings; then
            echo "::error::Generated bindings are out of date. Run 'cargo test' in apps/web/src-tauri and commit the result."
            exit 1
          fi
