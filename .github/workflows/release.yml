name: Release

# Tagging a version (e.g. `git tag v0.1.2 && git push origin v0.1.2`) builds the
# signed desktop app, generates the updater manifest (latest.json) and publishes
# them to a GitHub Release. The installed app polls that release for updates.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign and publish the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — see RELEASING.md. Generated with `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the web bundle at build time (public URL, not a secret).
          VITE_SERVER_URL: https://api.valotrak.app
        with:
          projectPath: apps/web
          tagName: ${{ github.ref_name }}
          releaseName: "ValoTrak ${{ github.ref_name }}"
          releaseBody: |
            Download an installer below. Existing desktop installs update
            automatically once this release is published.
          releaseDraft: false
          prerelease: false
          # Generate and upload latest.json so the in-app updater can find it.
          includeUpdaterJson: true
