[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2" }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
# Riot networking. native-tls (OS TLS: SecurityFramework/SChannel) so the
# self-signed local cert can be accepted for both HTTPS and WSS with no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.22"
regex = "1"
